product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64 ]


repositories:
  - id: mavenGoogle
    url: https://maven.aliyun.com/repository/google
  - id: mavenCentral
    url: https://maven.aliyun.com/repository/central

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  - $libs.androidx.navigation3.runtime
  - $libs.androidx.navigation3.ui
  - $libs.compose.material3.adaptive.navigation.suite
  - $libs.compose.material3.adaptive.navigation3
  - $libs.compose.material.icons.core
  - $libs.compose.material.icons.extended
  - $kotlin.serialization.core
  - bom: $libs.ktor.bom
  - $libs.ktor.client.core
  - $libs.ktor.client.engine.defaults
  - $libs.ktor.client.content.negotiation
  - $libs.ktor.client.auth
  - $libs.ktor.serialization.kotlinx.json
  - $libs.ktor.client.logging
  - $libs.koog.agents
  - $libs.koog.agents.additions


dependencies@android:
  - $compose.uiTooling

settings:
  compose:
    enabled: true
    resources:
      packageName: com.zhchmmx.welearn.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
  kotlin: 
    serialization: enabled
